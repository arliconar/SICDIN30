name: Build and Release SICDIN30

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión o tag (ej: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release (.NET 8)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        shell: pwsh
        run: |
          $inputTag = '${{ inputs.tag_name }}'.Trim()
          if ($inputTag -ne '') {
              $tag = $inputTag
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
              $tag = '${{ github.ref_name }}'
          } else {
              $tag = 'v1.0.' + (Get-Date -Format 'yyyyMMdd.HHmm')
          }
          Write-Host "Using Release Tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: |
          dotnet restore SICDIN30/SICIDIN.vbproj -r win-x64
          dotnet restore SICDIN30.Tests/SICDIN30.Tests.vbproj

      - name: Run Unit Tests
        run: |
          dotnet test SICDIN30.Tests/SICDIN30.Tests.vbproj -c Release --no-restore

      - name: Build ClickOnce Auto-Installer & Portable Release
        shell: pwsh
        run: |
          $tag = '${{ steps.vars.outputs.tag }}'
          $dist = 'dist'
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $installerDir = Join-Path $dist 'installer'
          $fullPkg = Join-Path $dist 'SICDIN30-Full'
          New-Item -ItemType Directory -Path (Join-Path $fullPkg 'Resources') -Force | Out-Null

          # 1. Determinar versión numérica válida para ClickOnce (Major.Minor.Build.Revision)
          $cleanVersion = ($tag -replace '^[^\d]*', '')
          $parts = $cleanVersion.Split('.')
          $vMajor = if ($parts.Length -gt 0 -and $parts[0] -match '^\d+$') { [int]$parts[0] } else { 1 }
          $vMinor = if ($parts.Length -gt 1 -and $parts[1] -match '^\d+$') { [int]$parts[1] } else { 0 }
          $vBuild = if ($parts.Length -gt 2 -and $parts[2] -match '^\d+$') { [int]$parts[2] } else { 8 }
          $vRev   = if ($parts.Length -gt 3 -and $parts[3] -match '^\d+$') { [int]$parts[3] } else { (Get-Date -Format 'HHmm') }
          $appVersion = "$vMajor.$vMinor.$vBuild.$vRev"
          Write-Host "Compiling ClickOnce Auto-Installer with ApplicationVersion: $appVersion"

          # 2. Publicar ClickOnce mediante MSBuild (genera setup.exe, manifests y Application Files)
          msbuild SICDIN30/SICIDIN.vbproj `
            /target:publish `
            /p:PublishProfile=ClickOnceProfile `
            /p:Configuration=Release `
            /p:ApplicationVersion=$appVersion `
            /p:PublishDir="${PWD}\$installerDir\" `
            /v:minimal

          # 3. Empaquetar el paquete instalador completo ClickOnce
          if (Test-Path $installerDir) {
              Compress-Archive -Path "$installerDir\*" -DestinationPath "$dist\SICDIN30-Installer-$tag.zip" -Force
              if (Test-Path "$installerDir\setup.exe") {
                  Copy-Item "$installerDir\setup.exe" "$dist\setup.exe"
              }
          }

          # 4. Publicar versión portable / standalone con dotnet publish
          dotnet publish SICDIN30/SICIDIN.vbproj -c Release -r win-x64 --no-self-contained -o "$dist\publish"

          # Copiar archivos portables
          Copy-Item "$dist\publish\*" "$fullPkg\" -Recurse
          if (Test-Path "$dist\publish\SICDIN30.exe") {
              Copy-Item "$dist\publish\SICDIN30.exe" "$dist\"
          }

          # Copiar archivo de base de datos / estructura si existe
          if (Test-Path 'syste.dat') {
              Copy-Item 'syste.dat' "$fullPkg\"
          }

          # 5. Empaquetar recursos en un zip dedicado (resources.zip)
          if (Test-Path 'SICDIN30\Resources') {
              Copy-Item 'SICDIN30\Resources\*' (Join-Path $fullPkg 'Resources') -Recurse
              Compress-Archive -Path 'SICDIN30\Resources\*' -DestinationPath "$dist\resources.zip" -Force
          }

          # 6. Empaquetar distribución completa portable
          Compress-Archive -Path "$fullPkg\*" -DestinationPath "$dist\SICDIN30-Full-$tag.zip" -Force

          # Limpieza de temporales internos
          if (Test-Path "$dist\publish") { Remove-Item -Recurse -Force "$dist\publish" }
          if (Test-Path "$fullPkg") { Remove-Item -Recurse -Force "$fullPkg" }

          Write-Host "Archivos generados exitosamente en $($dist):"
          Get-ChildItem $dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/SICDIN30-Installer-*.zip
            dist/setup.exe
            dist/SICDIN30.exe
            dist/resources.zip
            dist/SICDIN30-Full-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
